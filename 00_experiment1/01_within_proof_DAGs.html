", "to": "s51553166", "label": "cases' thi", "title": "cases' this with n hn", "arrows": "to", "color": {"color": "#000000"}, "width": 2}, {"from": "s51553166", "to": "s37148672", "label": "exact ⟨⟨f ", "title": "exact ⟨⟨f ^ n, n, rfl⟩, hn⟩", "arrows": "to", "color": {"color": "#000000"}, "width": 2}], "node_count": 24, "edge_count": 23, "num_premises": 28}];
        const theoremsPerPage = 16;
        let currentPage = 0;
        const totalPages = 3;
        const networks = [];

        // Initialize networks array
        for (let i = 0; i < 16; i++) {
            networks.push(null);
        }

        function renderPage(page) {
            const startIdx = page * theoremsPerPage;
            const endIdx = Math.min(startIdx + theoremsPerPage, allTheoremsData.length);

            // Clear all grids
            for (let i = 0; i < 16; i++) {
                const labelEl = document.getElementById('label-' + i);
                const networkEl = document.getElementById('network-' + i);

                if (networkEl) {
                    networkEl.innerHTML = '';
                }

                if (labelEl) {
                    labelEl.textContent = '';
                }

                // Destroy existing network
                if (networks[i]) {
                    networks[i].destroy();
                    networks[i] = null;
                }
            }

            // Render visible theorems
            for (let i = 0; i < endIdx - startIdx; i++) {
                const theoremIdx = startIdx + i;
                const theoremData = allTheoremsData[theoremIdx];

                if (!theoremData) continue;

                const labelEl = document.getElementById('label-' + i);
                const networkEl = document.getElementById('network-' + i);

                if (!labelEl || !networkEl) continue;

                // Set label with theorem name and stats
                const stats = 'N' + theoremData.node_count + ' E' + theoremData.edge_count + ' P' + theoremData.num_premises;
                labelEl.textContent = theoremData.short_name + ' | ' + stats;

                // Create network with hierarchical layout (left-to-right)
                const nodes = new vis.DataSet(theoremData.nodes);
                const edges = new vis.DataSet(theoremData.edges);
                const data = { nodes: nodes, edges: edges };
                const options = {
                    nodes: {
                        shape: 'box',
                        font: { size: 10, face: 'monospace', color: '#000000' },
                        margin: 5,
                        widthConstraint: { maximum: 60 },
                        heightConstraint: { maximum: 30 }
                    },
                    edges: {
                        font: { size: 7, align: 'top', color: '#000000' },
                        smooth: { type: 'cubicBezier' },
                        arrows: { to: { enabled: true, scaleFactor: 0.6 } },
                        width: 2
                    },
                    layout: {
                        hierarchical: {
                            enabled: true,
                            direction: 'LR',
                            sortMethod: 'directed',
                            levelSeparation: 80,
                            nodeSpacing: 60,
                            treeSpacing: 80
                        }
                    },
                    physics: {
                        enabled: false
                    },
                    interaction: {
                        dragNodes: true,
                        dragView: true,
                        zoomView: true,
                        hover: true
                    }
                };

                networks[i] = new vis.Network(networkEl, data, options);

                // Add custom tooltip on hover
                networks[i].on("hoverNode", function(params) {
                    const nodeId = params.node;
                    const nodeData = theoremData.nodes.find(n => n.id === nodeId);
                    if (nodeData && nodeData.tooltip_html) {
                        const tooltip = document.getElementById('custom-tooltip');
                        tooltip.textContent = nodeData.tooltip_html;
                        tooltip.style.display = 'block';
                        tooltip.style.left = params.event.center.x + 15 + 'px';
                        tooltip.style.top = params.event.center.y + 15 + 'px';
                    }
                });

                networks[i].on("blurNode", function(params) {
                    document.getElementById('custom-tooltip').style.display = 'none';
                });
            }

            // Update page info
            document.getElementById('page-info').textContent = 'Page ' + (page + 1) + ' / ' + totalPages;

            // Update button states
            document.getElementById('prev-btn').disabled = (page === 0);
            document.getElementById('next-btn').disabled = (page === totalPages - 1);
        }

        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage >= 0 && newPage < totalPages) {
                currentPage = newPage;
                renderPage(currentPage);
            }
        }

        // Initial render
        renderPage(0);
    </script>
