<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDG Dashboard</title>
  <script src="https://unpkg.com/cytoscape@3.29.2/dist/cytoscape.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --ink: #000000;
      --muted: #666666;
      --line: #000000;
      --accent: #000000;
      --hit: #333333;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Courier New", Courier, monospace;
      color: var(--ink);
      background: var(--bg);
    }
    .app {
      display: grid;
      grid-template-columns: 280px 1fr 280px;
      grid-template-rows: 1fr;
      height: 100vh;
      width: 100vw;
      gap: 8px;
      padding: 8px;
    }
    .panel {
      background: var(--panel);
      border: 2px solid var(--line);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .section {
      padding: 10px;
      border-bottom: 2px solid var(--line);
      flex-shrink: 0;
    }
    h1, h2, p { margin: 0; }
    h1 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    h2 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .sub {
      color: var(--muted);
      font-size: 11px;
    }
    input[type="search"] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--line);
      font-size: 12px;
      font-family: inherit;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 6px;
    }
    .stat {
      border: 1px solid var(--line);
      padding: 6px;
      font-size: 10px;
    }
    .stat strong {
      display: block;
      font-size: 16px;
      margin-top: 2px;
    }
    .list {
      overflow-y: auto;
      overflow-x: hidden;
      padding: 6px;
      flex: 1;
    }
    .item {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      background: #fff;
      padding: 6px;
      cursor: pointer;
      margin-bottom: 4px;
      font-family: inherit;
    }
    .item.active {
      border-width: 2px;
      background: #f5f5f5;
    }
    .item-name {
      font-weight: 700;
      font-size: 11px;
      word-break: break-word;
    }
    .item-meta, .mini {
      color: var(--muted);
      font-size: 10px;
    }
    .toolbar {
      padding: 6px 10px;
      border-bottom: 2px solid var(--line);
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    button.ctrl {
      border: 1px solid var(--line);
      background: #fff;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 10px;
      font-family: inherit;
    }
    button.ctrl.active {
      background: var(--ink);
      color: #fff;
    }
    .meta-row {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .chip {
      border: 1px solid var(--line);
      padding: 2px 6px;
      font-size: 9px;
    }
    #cyWrap {
      flex: 1;
      padding: 8px;
      min-height: 0;
      overflow: hidden;
    }
    #cy {
      width: 100%;
      height: 100%;
      border: 1px solid var(--line);
      background: #fff;
    }
    .footer {
      padding: 6px 10px;
      border-top: 2px solid var(--line);
      font-size: 10px;
      flex-shrink: 0;
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: inherit;
      font-size: 10px;
      line-height: 1.4;
    }
    .right-scroll {
      overflow-y: auto;
      padding: 6px;
      flex: 1;
    }
    .card {
      border: 1px solid var(--line);
      padding: 6px;
      margin-bottom: 6px;
      background: #fff;
    }
    .card-title {
      font-weight: 700;
      font-size: 11px;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 2px;
    }
    .hit-badge {
      font-weight: 700;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel sidebar">
      <div class="section">
        <h1>TDG</h1>
        <p class="sub">mathlib tactic graphs</p>
        <div style="margin-top:6px">
          <input id="search" type="search" placeholder="search theorem">
        </div>
        <div class="stats">
          <div class="stat">Total<strong id="statTotal">0</strong></div>
          <div class="stat">Shown<strong id="statVisible">0</strong></div>
        </div>
      </div>
      <div id="theoremList" class="list"></div>
    </aside>

    <main class="panel main">
      <div class="section">
        <h1 id="theoremName">Loading...</h1>
        <p id="statement" class="sub"></p>
        <div id="metaRow" class="meta-row"></div>
      </div>
      <div class="toolbar">
        <button id="fitBtn" class="ctrl">FIT</button>
        <button id="tbBtn" class="ctrl active">TB</button>
        <button id="lrBtn" class="ctrl">LR</button>
        <button id="edgeBtn" class="ctrl">EDGE</button>
        <button id="clearHitBtn" class="ctrl">CLR</button>
      </div>
      <div id="cyWrap">
        <div id="cy"></div>
      </div>
      <div class="footer">click node/edge for info | click witness to highlight</div>
    </main>

    <aside class="panel right">
      <div class="section">
        <h2>INSPECTOR</h2>
      </div>
      <div class="right-scroll">
        <div class="card">
          <div class="card-title">SELECTION</div>
          <pre id="selectionBox">-</pre>
        </div>
        <div class="card">
          <div class="card-title">PROOF</div>
          <pre id="proofText">-</pre>
        </div>
        <div class="card">
          <div class="card-title">WITNESSES</div>
          <div id="hitList" class="list" style="padding:0; max-height:none;"></div>
        </div>
      </div>
    </aside>
  </div>

  <script>
    const state = {
      index: [],
      filtered: [],
      activeSlug: null,
      activeGraph: null,
      activeHit: null,
      cy: null,
      direction: 'TB',
      showEdgeLabels: false,
    };

    function fmt(n) {
      return new Intl.NumberFormat('en-US').format(n || 0);
    }

    async function loadIndex() {
      const res = await fetch('./dashboard_data/index.json');
      state.index = await res.json();
      state.filtered = state.index.slice(0, 50);
      renderIndex();
      if (state.filtered.length) await loadGraph(state.filtered[0].slug);
    }

    function renderIndex() {
      document.getElementById('statTotal').textContent = fmt(state.index.length);
      document.getElementById('statVisible').textContent = fmt(state.filtered.length);
      const list = document.getElementById('theoremList');
      list.innerHTML = '';
      for (const item of state.filtered) {
        const btn = document.createElement('button');
        btn.className = 'item' + (item.slug === state.activeSlug ? ' active' : '');
        btn.innerHTML = `
          <div class="item-name">${item.theorem}</div>
          <div class="item-meta">${item.file}</div>
          <div class="mini">${item.proof_length} tactics | ${item.num_edges} edges</div>
        `;
        btn.onclick = () => loadGraph(item.slug);
        list.appendChild(btn);
      }
    }

    function filterIndex(q) {
      const query = q.trim().toLowerCase();
      if (!query) {
        state.filtered = state.index.slice(0, 50);
      } else {
        state.filtered = state.index
          .filter(x => x.theorem.toLowerCase().includes(query) || x.file.toLowerCase().includes(query))
          .slice(0, 50);
      }
      renderIndex();
    }

    function elementsFor(graph) {
      const out = [];
      for (const node of graph.nodes) {
        const p = node.position || { x: 0, y: 0 };
        const pos = state.direction === 'TB' ? { x: p.x, y: p.y } : { x: p.y, y: p.x };
        out.push({
          data: {
            id: node.id,
            label: node.label,
            raw: node.raw_tactic || '',
            type: node.type,
            tacticIndex: node.tactic_index,
            inputs: JSON.stringify(node.inputs || [], null, 2),
            outputs: JSON.stringify(node.outputs || [], null, 2),
            baseX: p.x,
            baseY: p.y,
          },
          position: pos,
        });
      }
      for (const edge of graph.edges) {
        out.push({
          data: {
            id: `${edge.source}->${edge.target}->${edge.object_id}`,
            source: edge.source,
            target: edge.target,
            label: edge.label,
            edgeType: edge.edge_type,
            evidence: edge.evidence,
            objectKind: edge.object_kind,
          }
        });
      }
      return out;
    }

    function fitGraph() {
      if (!state.cy) return;
      state.cy.fit(undefined, 30);
    }

    function installCy(graph) {
      const elements = elementsFor(graph);
      if (state.cy) state.cy.destroy();
      state.cy = cytoscape({
        container: document.getElementById('cy'),
        elements,
        pixelRatio: 1,
        hideEdgesOnViewport: true,
        minZoom: 0.05,
        maxZoom: 3,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': ele => ele.data('type') === 'special' ? '#f0f0f0' : '#000000',
              'border-color': '#000000',
              'border-width': 1,
              'label': 'data(label)',
              'font-size': 10,
              'color': '#ffffff',
              'text-wrap': 'none',
              'shape': 'round-rectangle',
              'width': 30,
              'height': 14,
            }
          },
          {
            selector: 'edge',
            style: {
              'curve-style': 'straight',
              'target-arrow-shape': 'triangle',
              'width': 1,
              'line-color': '#666666',
              'target-arrow-color': '#666666',
              'line-style': ele => ele.data('edgeType') === 'hyp_to_goal' ? 'dashed' : (ele.data('edgeType') === 'premise_use' ? 'dotted' : 'solid'),
              'label': state.showEdgeLabels ? 'data(label)' : '',
              'font-size': 9,
              'color': '#000',
              'text-margin-y': -8,
              'text-rotation': '0deg',
              'text-background-color': '#fff',
              'text-background-opacity': 1,
              'text-background-padding': 2,
            }
          },
          {
            selector: '.hit-node',
            style: {
              'background-color': '#333333',
              'border-color': '#000000',
              'border-width': 2,
            }
          },
          {
            selector: '.hit-edge',
            style: {
              'line-color': '#333333',
              'target-arrow-color': '#333333',
              'width': 2,
            }
          },
          {
            selector: '.dim',
            style: {
              'opacity': 0.15,
            }
          }
        ],
        layout: {
          name: 'preset',
          fit: true,
          padding: 20,
        }
      });

      state.cy.on('tap', 'node', evt => {
        const d = evt.target.data();
        document.getElementById('selectionBox').textContent =
          `${d.tacticIndex === null ? d.label : 't' + d.tacticIndex + ': ' + d.raw}\n\nin: ${d.inputs}\nout: ${d.outputs}`;
      });

      state.cy.on('tap', 'edge', evt => {
        const d = evt.target.data();
        document.getElementById('selectionBox').textContent =
          `${d.edgeType} | ${d.label}\nobj: ${d.objectKind}\nsrc: ${d.source}\ndst: ${d.target}\n${d.evidence}`;
      });

      fitGraph();
    }

    function renderGraphMeta(graph) {
      document.getElementById('theoremName').textContent = graph.theorem;
      document.getElementById('statement').textContent = (graph.statement || '').substring(0, 80);
      document.getElementById('proofText').textContent = (graph.proof_text || '').substring(0, 500);
      const tacticCount = graph.nodes.filter(n => n.type === 'tactic').length;
      const hits = (graph.collapsible_hits || []).length;
      document.getElementById('metaRow').innerHTML = `
        <span class="chip">${graph.file.split('\\').pop().split('/').pop()}</span>
        <span class="chip">${tacticCount} tactics</span>
        <span class="chip">${graph.edges.length} edges</span>
        <span class="chip">${hits} hits</span>
      `;
    }

    function clearHighlight() {
      state.activeHit = null;
      if (!state.cy) return;
      state.cy.nodes().removeClass('hit-node').removeClass('dim');
      state.cy.edges().removeClass('hit-edge').removeClass('dim');
      renderHits(state.activeGraph);
    }

    function highlightHit(hit) {
      if (!state.cy) return;
      clearHighlight();
      state.activeHit = hit.witness_id;
      const ids = new Set(hit.host_node_ids || []);
      state.cy.nodes().forEach(n => {
        if (ids.has(n.id())) n.addClass('hit-node');
        else n.addClass('dim');
      });
      state.cy.edges().forEach(e => {
        const inside = ids.has(e.data('source')) && ids.has(e.data('target'));
        if (inside) e.addClass('hit-edge');
        else e.addClass('dim');
      });
      renderHits(state.activeGraph);
    }

    function renderHits(graph) {
      const wrap = document.getElementById('hitList');
      wrap.innerHTML = '';
      const hits = (graph && graph.collapsible_hits) ? graph.collapsible_hits.slice(0, 50) : [];
      if (!hits.length) {
        wrap.innerHTML = '<div class="mini">no witnesses</div>';
        return;
      }
      for (const hit of hits) {
        const btn = document.createElement('button');
        btn.className = 'item' + (hit.witness_id === state.activeHit ? ' active' : '');
        btn.innerHTML = `
          <div class="item-name">${(hit.node_labels || []).join(' > ')}</div>
          <div class="mini">${hit.host_node_ids.length} nodes</div>
          <div class="hit-badge">${fmt(hit.estimated_corpus_savings || 0)}</div>
        `;
        btn.onclick = () => highlightHit(hit);
        wrap.appendChild(btn);
      }
    }

    async function loadGraph(slug) {
      state.activeSlug = slug;
      renderIndex();
      const res = await fetch(`./dashboard_data/graphs/${slug}.json`);
      const graph = await res.json();
      state.activeGraph = graph;
      state.activeHit = null;
      renderGraphMeta(graph);
      installCy(graph);
      renderHits(graph);
      document.getElementById('selectionBox').textContent = '-';
    }

    function reorient(direction) {
      state.direction = direction;
      document.getElementById('tbBtn').classList.toggle('active', direction === 'TB');
      document.getElementById('lrBtn').classList.toggle('active', direction === 'LR');
      if (!state.cy) return;
      state.cy.nodes().forEach(node => {
        const x = node.data('baseX') || 0;
        const y = node.data('baseY') || 0;
        node.position(direction === 'TB' ? { x, y } : { x: y, y: x });
      });
      fitGraph();
    }

    document.getElementById('search').addEventListener('input', e => filterIndex(e.target.value));
    document.getElementById('fitBtn').onclick = fitGraph;
    document.getElementById('tbBtn').onclick = () => reorient('TB');
    document.getElementById('lrBtn').onclick = () => reorient('LR');
    document.getElementById('clearHitBtn').onclick = clearHighlight;
    document.getElementById('edgeBtn').onclick = evt => {
      state.showEdgeLabels = !state.showEdgeLabels;
      evt.currentTarget.classList.toggle('active', state.showEdgeLabels);
      if (state.cy) {
        state.cy.style().selector('edge').style('label', state.showEdgeLabels ? 'data(label)' : '').update();
      }
    };

    loadIndex().catch(err => {
      document.getElementById('theoremName').textContent = 'Load failed';
      document.getElementById('statement').textContent = 'Serve over HTTP with dashboard_data/';
      console.error(err);
    });
  </script>
</body>
</html>
